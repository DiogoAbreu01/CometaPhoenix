name: Cometa Phoenix / Linux C++17
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl1-mesa-dri mesa-utils xvfb xauth
      - name: Configure native application
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOMETA_GAME=ON
      - name: Build C++17
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: OpenGL smoke tests
        run: |
          for circuit in 0 1 2; do
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/cometa_game --benchmark --frames 4 --autopilot --circuit "$circuit" --weather rain --quality 3
          done
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/cometa_game --benchmark --frames 4 --garage --quality 3
      - name: Install portable layout
        run: cmake --install build --prefix linux-portable
      - uses: actions/upload-artifact@v4
        with:
          name: Cometa-Phoenix-Linux-x64
          path: linux-portable/
