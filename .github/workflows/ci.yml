name: Cometa Phoenix / C++17 CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure motor and tests (no GUI dependency)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOMETA_GAME=OFF
      - name: Build C++17
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
